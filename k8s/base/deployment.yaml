apiVersion: apps/v1
kind: Deployment
metadata:
  name: pf-devops-app
  namespace: pf-devops
  labels:
    app: pf-devops-app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pf-devops-app
  template:
    metadata:
      labels:
        app: pf-devops-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          # La imagen real la reemplaza el pipeline con `kustomize edit set image`
          image: ghcr.io/OWNER/pf-devops-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: pf-devops-config
                  key: APP_VERSION
          # Requests bajos = mejor empaquetado en nodos = menor costo (FinOps).
          # El HPA calcula el % de uso sobre estos requests.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
