apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pf-devops-app
  namespace: pf-devops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pf-devops-app
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
    # Bajar despacio evita oscilaciones, pero igual libera capacidad (costo)
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
