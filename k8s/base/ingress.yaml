apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pf-devops-app
  namespace: pf-devops
spec:
  ingressClassName: nginx
  rules:
    # Sin host: responde por la IP/DNS del balanceador. Para usar un dominio, agregar "host:".
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pf-devops-app
                port:
                  name: http
