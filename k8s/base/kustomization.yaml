apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pf-devops

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

configMapGenerator:
  - name: pf-devops-config
    literals:
      - APP_VERSION=dev

# El pipeline hace: kustomize edit set image ghcr.io/OWNER/pf-devops-app=ghcr.io/<owner>/pf-devops-app:<sha>
images:
  - name: ghcr.io/OWNER/pf-devops-app
    newTag: latest
